name: build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: ツールを入れる
        run: apt-get update && apt-get install -y zip

      - name: 常駐版をビルド
        run: make -C sysmodule

      - name: アプリ用のライブラリを入れる
        run: |
          # pkg.devkitpro.org が一時的に 403 を返すことがあるので、間隔をあけて最大6回リトライ
          for i in 1 2 3 4 5 6; do
            if dkp-pacman -Syu --noconfirm switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl; then
              exit 0
            fi
            echo "失敗($i/6)。$((i*20))秒待って再試行します"
            sleep $((i*20))
          done
          exit 1

      - name: 動画プレビュー用の ffmpeg を入れる(入らなくてもビルドは続く)
        run: |
          # 入らなかった理由が分かるように、メッセージはそのまま表示する。403のときはリトライする
          dkp-pacman -Ss ffmpeg || true
          ok=0
          for i in 1 2 3 4 5; do
            if dkp-pacman -Syu --noconfirm switch-ffmpeg; then ok=1; break; fi
            echo "ffmpegの取得に失敗($i/5)。$((i*20))秒待って再試行します"
            sleep $((i*20))
          done
          if [ "$ok" = 1 ]; then
            echo "switch-ffmpeg: インストール成功"
            ls /opt/devkitpro/portlibs/switch/lib/pkgconfig | grep -i "libav\|libsw" || true
          else
            echo "::warning::switch-ffmpeg が入りませんでした。動画のプレビューなしでビルドします"
          fi

      - name: アプリ(nro)をビルド
        run: |
          echo "--- pkg-config の結果 ---"
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-pkg-config --libs --static sdl2 SDL2_ttf SDL2_image libcurl || true
          ls /opt/devkitpro/portlibs/switch/lib | grep -i sdl2 || true
          make -C app

      - name: 配布用にまとめる
        run: |
          # 版は app/Makefile の APP_VERSION から取る(zipの名前などに使う)
          VER=$(sed -n 's/^APP_VERSION *:= *//p' app/Makefile | tr -d '\r ')
          echo "VER=$VER" >> "$GITHUB_ENV"
          D=pkg/atmosphere/contents/4200000000000A7E
          mkdir -p $D/flags pkg/config/nxdiscord
          cp sysmodule/out/nxdiscord.nsp $D/exefs.nsp
          mkdir -p pkg/switch/NXShot
          cp app/out/NXShot.nro pkg/switch/NXShot/NXShot.nro
          touch $D/flags/boot2.flag
          printf '[ここにWebhook URLを貼る]\nlimit=10\nauto=1\n' > pkg/config/nxdiscord/config.txt
          cp README.md LICENSE CHANGELOG.md pkg/
          (cd pkg && zip -qr ../NXShot-$VER.zip .)
          # アプリのアップデート用に、単体のファイルも用意する
          cp app/out/NXShot.nro NXShot.nro
          cp sysmodule/out/nxdiscord.nsp nxdiscord.nsp

      - uses: actions/upload-artifact@v4
        with:
          name: NXShot-${{ env.VER }}
          path: pkg

      - name: Releaseに添付する
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NXShot-${{ env.VER }}.zip
            NXShot.nro
            nxdiscord.nsp
