name: build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: ツールを入れる
        run: apt-get update && apt-get install -y zip curl

      - name: 常駐版をビルド
        run: make -C sysmodule

      - name: ライブラリのキャッシュを戻す
        id: libcache
        uses: actions/cache/restore@v4
        with:
          path: /opt/devkitpro/portlibs
          key: portlibs-sdl2-image-ttf-curl-ffmpeg-v1

      - name: アプリ用のライブラリを入れる(キャッシュが無いときだけ)
        id: libs
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          # pkg.devkitpro.org が403を返すことがあるので、間隔をあけてリトライする。
          # 2回失敗したら、curlでブラウザの名前を名乗って取りにいく方法も試す。
          enable_alt() {
            CONF=/opt/devkitpro/pacman/etc/pacman.conf
            if [ -f "$CONF" ] && ! grep -q '^XferCommand' "$CONF"; then
              sed -i '/^\[options\]/a XferCommand = /usr/bin/curl -fL -A "Mozilla/5.0" -o %o %u' "$CONF"
              echo "予備のダウンロード方法(curl)を有効にしました"
            fi
          }
          ok=0
          for i in 1 2 3 4; do
            if dkp-pacman -Syu --noconfirm switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl; then ok=1; break; fi
            echo "失敗($i/4)。$((i*30))秒待って再試行します"
            if [ "$i" -ge 2 ]; then enable_alt; fi
            sleep $((i*30))
          done
          [ "$ok" = 1 ] || exit 1
          # 動画プレビュー用のffmpeg(入らなくてもビルドは続く)。データベースは上で取得済み
          ff=0
          for i in 1 2 3; do
            if dkp-pacman -S --noconfirm switch-ffmpeg; then ff=1; break; fi
            echo "ffmpegの取得に失敗($i/3)。$((i*20))秒待って再試行します"
            sleep $((i*20))
          done
          if [ "$ff" = 1 ]; then
            echo "switch-ffmpeg: インストール成功"
          else
            echo "::warning::switch-ffmpeg が入りませんでした。動画のプレビューなしでビルドします"
          fi
          echo "ffmpeg=$ff" >> "$GITHUB_OUTPUT"

      - name: ライブラリのキャッシュを保存(全部入ったときだけ)
        if: steps.libs.outcome == 'success' && steps.libs.outputs.ffmpeg == '1'
        uses: actions/cache/save@v4
        with:
          path: /opt/devkitpro/portlibs
          key: portlibs-sdl2-image-ttf-curl-ffmpeg-v1

      - name: アプリ(nro)をビルド
        run: |
          echo "--- pkg-config の結果 ---"
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-pkg-config --libs --static sdl2 SDL2_ttf SDL2_image libcurl || true
          ls /opt/devkitpro/portlibs/switch/lib | grep -i sdl2 || true
          make -C app

      - name: オーバーレイ(ovl)をビルド
        id: ovl
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/WerWolv/libtesla overlay/libtesla
          make -C overlay

      - name: 配布用にまとめる
        run: |
          # 版は app/Makefile の APP_VERSION から取る(zipの名前などに使う)
          VER=$(sed -n 's/^APP_VERSION *:= *//p' app/Makefile | tr -d '\r ')
          echo "VER=$VER" >> "$GITHUB_ENV"
          D=pkg/atmosphere/contents/4200000000000A7E
          mkdir -p $D/flags pkg/config/nxdiscord
          cp sysmodule/out/nxdiscord.nsp $D/exefs.nsp
          mkdir -p pkg/switch/NXShot
          cp app/out/NXShot.nro pkg/switch/NXShot/NXShot.nro
          touch $D/flags/boot2.flag
          printf '[ここにWebhook URLを貼る]\nlimit=10\nauto=1\n' > pkg/config/nxdiscord/config.txt
          # オーバーレイは、ビルドできたときだけ入れる(失敗しても、ほかの配布物は出す)
          # 「.」で始まるフォルダはiPhoneなどで見えないので、zipの直下に置く。
          # Teslaで使うときは、switch/.overlays/ へ移す(READMEを参照)
          if [ -f overlay/out/NXShot.ovl ]; then
            cp overlay/out/NXShot.ovl pkg/NXShot.ovl
            cp overlay/out/NXShot.ovl NXShot.ovl
          fi
          cp README.md LICENSE CHANGELOG.md pkg/
          (cd pkg && zip -qr ../NXShot-$VER.zip .)
          # アプリのアップデート用に、単体のファイルも用意する
          cp app/out/NXShot.nro NXShot.nro
          cp sysmodule/out/nxdiscord.nsp nxdiscord.nsp

      - uses: actions/upload-artifact@v4
        with:
          name: NXShot-${{ env.VER }}
          path: pkg

      - name: Releaseに添付する
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NXShot-${{ env.VER }}.zip
            NXShot.nro
            nxdiscord.nsp
            NXShot.ovl
