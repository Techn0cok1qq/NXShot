name: build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: ツールを入れる
        run: apt-get update && apt-get install -y zip curl

      - name: 常駐版をビルド
        run: make -C sysmodule

      - name: ライブラリのキャッシュを復元する
        id: portlibs-cache
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro/portlibs/switch
          key: portlibs-switch-v1

      - name: アプリ用のライブラリを入れる
        if: steps.portlibs-cache.outputs.cache-hit != 'true'
        run: |
          # pkg.devkitpro.org が GitHub からのアクセスに 403 を返すことがある。
          # 標準のダウンロード方法で失敗したら、curl(ブラウザ風のUser-Agent)でも試す
          CONF=/opt/devkitpro/pacman/etc/pacman.conf
          cp "$CONF" /tmp/pacman-curl.conf
          sed -i '/^\[options\]/a XferCommand = /usr/bin/curl -fL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64)" -o %o %u' /tmp/pacman-curl.conf
          PKGS="switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl"
          for i in 1 2 3 4 5 6; do
            if dkp-pacman -Syu --noconfirm $PKGS; then exit 0; fi
            echo "標準の方法で失敗($i/6)。curlで再試行します"
            if dkp-pacman --config /tmp/pacman-curl.conf -Syu --noconfirm $PKGS; then exit 0; fi
            echo "失敗($i/6)。$((i*20))秒待って再試行します"
            sleep $((i*20))
          done
          exit 1

      - name: 動画プレビュー用の ffmpeg を入れる(入らなくてもビルドは続く)
        if: steps.portlibs-cache.outputs.cache-hit != 'true'
        run: |
          # 入らなくてもビルドは続く。メッセージはそのまま表示する
          ok=0
          for i in 1 2 3; do
            if dkp-pacman -Syu --noconfirm switch-ffmpeg || dkp-pacman --config /tmp/pacman-curl.conf -Syu --noconfirm switch-ffmpeg; then ok=1; break; fi
            echo "ffmpegの取得に失敗($i/3)。$((i*20))秒待って再試行します"
            sleep $((i*20))
          done
          if [ "$ok" = 1 ]; then
            echo "switch-ffmpeg: インストール成功"
          else
            echo "::warning::switch-ffmpeg が入りませんでした。動画のプレビューなしでビルドします"
          fi

      - name: アプリ(nro)をビルド
        run: |
          echo "--- pkg-config の結果 ---"
          /opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-pkg-config --libs --static sdl2 SDL2_ttf SDL2_image libcurl || true
          ls /opt/devkitpro/portlibs/switch/lib | grep -i sdl2 || true
          make -C app

      - name: 配布用にまとめる
        run: |
          # 版は app/Makefile の APP_VERSION から取る(zipの名前などに使う)
          VER=$(sed -n 's/^APP_VERSION *:= *//p' app/Makefile | tr -d '\r ')
          echo "VER=$VER" >> "$GITHUB_ENV"
          D=pkg/atmosphere/contents/4200000000000A7E
          mkdir -p $D/flags pkg/config/nxdiscord
          cp sysmodule/out/nxdiscord.nsp $D/exefs.nsp
          mkdir -p pkg/switch/NXShot
          cp app/out/NXShot.nro pkg/switch/NXShot/NXShot.nro
          touch $D/flags/boot2.flag
          printf '[ここにWebhook URLを貼る]\nlimit=10\nauto=1\n' > pkg/config/nxdiscord/config.txt
          cp README.md LICENSE CHANGELOG.md pkg/
          (cd pkg && zip -qr ../NXShot-$VER.zip .)
          # アプリのアップデート用に、単体のファイルも用意する
          cp app/out/NXShot.nro NXShot.nro
          cp sysmodule/out/nxdiscord.nsp nxdiscord.nsp

      - uses: actions/upload-artifact@v4
        with:
          name: NXShot-${{ env.VER }}
          path: pkg

      - name: Releaseに添付する
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NXShot-${{ env.VER }}.zip
            NXShot.nro
            nxdiscord.nsp
